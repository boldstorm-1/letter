<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Message For You ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fbeef1;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .container {
      text-align: center;
      z-index: 2;
      padding: 20px;
    }

    .envelope {
      width: 220px;
      height: 150px;
      background: #e63946;
      margin: 0 auto;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }

    .envelope:hover {
      transform: scale(1.05);
    }

    .letter {
      display: none;
      max-width: 480px;
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      animation: fadeIn 1.5s forwards;
      color: #2b2d42;
      line-height: 1.7;
      text-align: left;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Audio element (plays music.mp3) -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="envelope" id="envelope" onclick="openLetter()">
      ✉️ Click to Open
    </div>

    <div class="letter" id="letter">
      <h2 style="color: #e63946; margin-top: 0;">Good morning princess,</h2>
      <p>>I love you aaaa lottt, thank you for being the perfect person for meee, thank you for being with me in my happiness to sadness</p>
      <p>I love you soooooooo much babyy :3</p>
      <p>TNow wake up with that pretty smile, and enjoy your day, I love you.</p>
      <p style="text-align: right; font-weight: bold; margin-bottom: 0;">
        Your bof,<br><span style="color: #e63946;">[tasin]</span>
      </p>
    </div>
  </div>

  <script>
    function openLetter() {
      // Hide envelope & show letter
      document.getElementById('envelope').style.display = 'none';
      document.getElementById('letter').style.display = 'block';
      
      // Start background music
      const music = document.getElementById('bgMusic');
      music.play().catch(e => console.log("Audio play blocked by browser:", e));

      // Start floating hearts
      createHearts();
    }

    function createHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = Math.random() * 2 + 3 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }, 350);
    }
  </script>
</body>
</html>
